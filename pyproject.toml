[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "just-finish-it"
version = "0.1.0"
description = "An autonomous plan-driven coding agent: it plans, implements and tests in a local .JFI workspace."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "inputimeout>=1.0.4",
    "openai>=3.8.0",
    "prompt-toolkit>=3.0.53",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
jfi = "autonomous_runner:main"
JFI = "autonomous_runner:main"

[tool.hatch.build.targets.wheel]
packages = ["llm", "manager", "session", "tool"]
include = ["autonomous_runner.py"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = [".venv", ".JFI"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
