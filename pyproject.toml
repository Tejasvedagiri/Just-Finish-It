[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "just-finish-it"
version = "0.1.0"
description = "An autonomous plan-driven coding agent: it plans, implements and tests in a local JFI workspace."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "inputimeout>=1.0.4",
    "mss>=9.0.1",
    "openai>=3.8.0",
    "playwright>=1.62.0",
    "prompt-toolkit>=3.0.53",
    "python-dotenv>=1.2.3",
]

[project.optional-dependencies]
# Only needed for `jfi-web` / src/JFI/web/dashboard.py -- the core agent has
# no dependency on this, so it stays opt-in rather than in the base install.
web = ["streamlit>=1.38"]
# Only needed for a session reporting to a fleet master
# (src/JFI/manager/socket_reporter.py, gated on MASTER_WS_URL being set) --
# the core agent has no dependency on this either. The master itself is a
# separate Node project (frontend/, `npm run master`), not Python -- see
# "Fleet dashboard" in README.
master = ["websockets>=13"]

[project.scripts]
jfi = "JFI.runner:main"
JFI = "JFI.runner:main"
jfi-web = "JFI.web.launcher:main"
build = "build_binary:main"

[tool.hatch.build.targets.wheel]
packages = ["src/JFI", "src/build_binary"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test"]
norecursedirs = [".venv", "JFI"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["/JFI", "/dist", "/build"]  # runtime session data / build output at repo root, not src/JFI

[tool.ruff.lint]
# Pyflakes (F) catches real bugs (unused imports, undefined names, unused
# variables, ...); the pycodestyle subset (E) is kept to the error-level
# checks only -- deliberately not the full style ruleset (line-length
# nitpicks, import sorting, etc.) for an already-written codebase with its
# own established prose-comment-heavy style.
select = ["E4", "E7", "E9", "F"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyinstaller>=6.11.0",
    "ruff>=0.16.6",
]
