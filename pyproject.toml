[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "just-finish-it"
version = "0.1.0"
description = "An autonomous plan-driven coding agent: it plans, implements and tests in a local .JFI workspace."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "inputimeout>=1.0.4",
    "mss>=9.0.1",
    "openai>=3.8.0",
    "prompt-toolkit>=3.0.53",
    "python-dotenv>=1.2.3",
    "typer>=0.27.2",
]

[project.scripts]
jfi = "JFI.runner:main"
JFI = "JFI.runner:main"
shbuild = "shbuild.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/JFI", "src/shbuild"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test"]
norecursedirs = [".venv", ".JFI"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
